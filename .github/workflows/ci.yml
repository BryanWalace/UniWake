name: CI

# ADR-030: work happens on `dev`; `main` only receives owner-approved merges. Quality gates only:
# nothing here publishes a release (the installers built below are throwaway test builds).
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint, format, typecheck, tests + coverage, check:deps
        run: npm run verify
      - name: Dependency audit (runtime deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: End-to-end tests (Playwright, Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  windows:
    name: Tests (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: PowerShell scripts (PSScriptAnalyzer + Pester)
        shell: powershell
        run: npm run test:ps
      - name: End-to-end smoke in Microsoft Edge (NFR-09)
        run: npm run e2e:edge

  installer:
    name: Installer (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build two installer versions
        shell: pwsh
        run: |
          ./scripts/ci/build-installer.ps1 -Version 0.0.1 -OutDir build/out -OutName UniWake-Setup-0.0.1
          ./scripts/ci/build-installer.ps1 -Version 0.0.2 -OutDir build/out -OutName UniWake-Setup-0.0.2
      - name: Install, upgrade and uninstall (AC-001-01a, AC-001-02, AC-001-03)
        shell: pwsh
        run: ./scripts/ci/installer-smoke.ps1 -V1Setup build/out/UniWake-Setup-0.0.1.exe -V2Setup build/out/UniWake-Setup-0.0.2.exe
      - name: Upload installer logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs
          path: build/ci-logs/
          if-no-files-found: ignore

  update-e2e:
    name: Update end-to-end (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build three test installers (fake release server on loopback, ADR-025)
        shell: pwsh
        run: |
          $api = 'http://127.0.0.1:47199'
          ./scripts/ci/build-installer.ps1 -Version 0.0.3 -OutDir build/out -OutName UniWake-Setup-0.0.3 -TestUpdateApi $api
          ./scripts/ci/build-installer.ps1 -Version 0.0.4 -OutDir build/out -OutName UniWake-Setup-0.0.4 -TestUpdateApi $api
          ./scripts/ci/build-installer.ps1 -Version 0.0.5 -OutDir build/out -OutName UniWake-Setup-0.0.5 -TestUpdateApi $api -Break
      - name: Update through the panel, then roll back a broken version
        shell: pwsh
        run: ./scripts/ci/update-e2e.ps1 -BaseSetup build/out/UniWake-Setup-0.0.3.exe -NextSetup build/out/UniWake-Setup-0.0.4.exe -BrokenSetup build/out/UniWake-Setup-0.0.5.exe
      - name: Upload update logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: update-logs
          path: build/ci-logs/
          if-no-files-found: ignore
